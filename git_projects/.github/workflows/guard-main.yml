name: Guard Main Branch

on:
    push:
        branches:
            - main

jobs:
    verify-fast-forward:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Verify Lineage
              run: |
                  git fetch origin staging
                  if ! git merge-base --is-ancestor ${{ github.sha }} origin/staging; then
                    echo "ERROR: Push to main is not a fast-forward from staging."
                    exit 1
                  fi
                  echo "Verified: main is in exact lineage with staging."
