name: Prevent Branch Deletion

on:
    delete:

jobs:
    block-deletion:
        runs-on: ubuntu-latest
        steps:
            - name: Block Deletion of Core Branches
              env:
                  DELETED_REF: ${{ github.event.ref }}
                  PROTECTED_BRANCHES: "main staging"
              run: |
                  for branch in $PROTECTED_BRANCHES; do
                    if [ "$DELETED_REF" = "$branch" ]; then
                      echo "ERROR: Deletion of protected branch '$DELETED_REF' is strictly forbidden!"
                      exit 1
                    fi
                  done

                  echo "Deleted ref '$DELETED_REF' is not protected. Allowed."
