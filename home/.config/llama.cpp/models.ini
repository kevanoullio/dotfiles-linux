[*]
# Global defaults
# fit auto calc model layers to fit on gpu
# fit [on|off] | whether to adjust unset arguments to fit in device memory
# fit-ctx acts as a safety floor for kv cache loading to gpu, if kv cache offloaded to cpu/ram then this has no effect
fit = on
fit-target = 1024
# cache
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
# threads
threads = 7
parallel = 1

[qwen3.8-27b-fast]
# model file
model = /home/kevano/.lmstudio/models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-IQ3_S.gguf
n-gpu-layers = all
# vision
mmproj = /home/kevano/.lmstudio/models/unsloth/Qwen3.8-27B-GGUF/mmproj-F16.gguf
no-mmproj-offload = true
# context
fit-ctx = 16384
ctx-size = 0
context-shift = true
# cache
cache-type-k = q5_0
cache-type-v = q4_0
# batch size
batch-size = 4096
ubatch-size = 256
# model parameters
temp = 0.7
top-k = 20
top-p = 0.95
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.05

